name: Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR title and commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          re='^(feat|fix|docs|refactor|test|build|ci|chore|perf)(\([a-z0-9_-]+\))?!?: .+'
          failed=0
          if ! [[ $PR_TITLE =~ $re ]]; then
            echo "::error::PR title is not a Conventional Commit: $PR_TITLE"
            failed=1
          fi
          while read -r sha subject; do
            if ! [[ $subject =~ $re ]]; then
              echo "::error::Commit $sha is not a Conventional Commit: $subject"
              failed=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE_SHA..$HEAD_SHA")
          exit "$failed"
