name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ble-collector
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ghcr.io/jdrouet/home-monitor-ble-collector:${{ steps.sha.outputs.short }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: store
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ghcr.io/jdrouet/home-monitor-store:${{ steps.sha.outputs.short }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dashboard
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ghcr.io/jdrouet/home-monitor-dashboard:${{ steps.sha.outputs.short }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: alerter
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ghcr.io/jdrouet/home-monitor-alerter:${{ steps.sha.outputs.short }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: weather-collector
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ghcr.io/jdrouet/home-monitor-weather-collector:${{ steps.sha.outputs.short }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch sha tags
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          short="sha-${GITHUB_SHA::7}"
          for svc in ble-collector store dashboard alerter weather-collector; do
            image="ghcr.io/jdrouet/home-monitor-$svc"
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=$SOURCE" \
              --tag "$image:$short" \
              "$image:$short-amd64" "$image:$short-arm64"
          done

  latest:
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: images-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Any run promotes main's current head, so a replaced pending run cannot
      # leave latest behind. Only an older run may defer; the head's run fails loudly.
      - name: Move latest to the head of main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          short="sha-${head::7}"
          if [ "$head" != "$GITHUB_SHA" ]; then
            for svc in ble-collector store dashboard alerter weather-collector; do
              if ! docker buildx imagetools inspect "ghcr.io/jdrouet/home-monitor-$svc:$short" >/dev/null 2>&1; then
                echo "::notice::$short is not published yet; its own run will move latest"
                exit 0
              fi
            done
          fi
          for svc in ble-collector store dashboard alerter weather-collector; do
            image="ghcr.io/jdrouet/home-monitor-$svc"
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=$SOURCE" \
              --tag "$image:latest" "$image:$short"
          done
