x-service: &service
  restart: unless-stopped
  volumes:
    - ./config.toml:/etc/home-monitor/config.toml:ro
  environment:
    HOME_MONITOR_CONFIG: /etc/home-monitor/config.toml
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    interval: 10s
    timeout: 3s
    retries: 3

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3

  ble-collector:
    <<: *service
    image: ghcr.io/jdrouet/home-monitor-ble-collector:latest
    volumes:
      - ./config.toml:/etc/home-monitor/config.toml:ro
      - /run/dbus:/run/dbus
    environment:
      HOME_MONITOR_CONFIG: /etc/home-monitor/config.toml
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
    depends_on:
      mosquitto:
        condition: service_healthy

  store:
    <<: *service
    image: ghcr.io/jdrouet/home-monitor-store:latest
    volumes:
      - ./config.toml:/etc/home-monitor/config.toml:ro
      - store-data:/data
    depends_on:
      mosquitto:
        condition: service_healthy

  dashboard:
    <<: *service
    image: ghcr.io/jdrouet/home-monitor-dashboard:latest
    ports:
      - "8080:8080"
    depends_on:
      store:
        condition: service_healthy

  ntfy:
    image: binwiederhier/ntfy:v2
    command: serve
    restart: unless-stopped
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  alerter:
    <<: *service
    image: ghcr.io/jdrouet/home-monitor-alerter:latest
    volumes:
      - ./config.toml:/etc/home-monitor/config.toml:ro
      - alerter-data:/data
    env_file: .env
    depends_on:
      mosquitto:
        condition: service_healthy
      ntfy:
        condition: service_healthy

  weather-collector:
    <<: *service
    image: ghcr.io/jdrouet/home-monitor-weather-collector:latest
    depends_on:
      mosquitto:
        condition: service_healthy

  health-collector:
    <<: *service
    image: ghcr.io/jdrouet/home-monitor-health-collector:latest
    volumes:
      - ./config.toml:/etc/home-monitor/config.toml:ro
      - garmin-tokens:/tokens
      - garmin-archive:/archive
    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  alerter-data:
  garmin-archive:
  garmin-tokens:
  mosquitto-data:
  store-data:
